[project]
name = "strands-vs-adk-part2"
version = "0.1.0"
description = "Strands vs ADK, Part 2: the same learning system built twice"
readme = "README.md"
requires-python = ">=3.13"

# Pinned to match Part 1, so both parts describe the same versions. The OpenTelemetry
# pins are load bearing: without them pip resolves google-adk back to 1.x.
dependencies = [
    "strands-agents[web-fetch]==1.55.1",
    "google-adk==2.9.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    # the ADK side flattens pages with BeautifulSoup on lxml
    "lxml>=5",
    # the judge validates course.json against its schema
    "jsonschema>=4",
]

[project.scripts]
learn = "learning.front:main"

[project.optional-dependencies]
# Only if you authenticate with `aws login`. That credential provider needs the CRT
# bindings, which the AWS CLI bundles and a plain virtualenv does not.
aws-login = ["botocore[crt]"]
test = ["pytest>=8"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learning", "impl"]
