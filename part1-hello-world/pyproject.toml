[project]
name = "strands-vs-adk-part1"
version = "0.1.0"
description = "Runnable examples for Strands vs ADK, Part 1: Hello World"
readme = "README.md"
requires-python = ">=3.13"

# Pinned, not floating. The article is a comparison at a fixed point, so a reader
# who runs this months from now should get what the article describes.
#
# The OpenTelemetry pins are load bearing. google-adk caps opentelemetry-api at
# 1.42.1 while strands-agents allows anything under 2.0.0. Install both without
# these and pip resolves google-adk back to 1.x instead of failing.
dependencies = [
    "strands-agents==1.55.1",
    "google-adk==2.9.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
]

[project.optional-dependencies]
# Section 07. You install strands-agents-evals and you import strands_evals.
evals = [
    "strands-agents-evals==1.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]
# Section 08.
serve = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]
# Only if you authenticate with `aws login`. That credential provider needs the
# CRT bindings, which the AWS CLI bundles and a plain virtualenv does not, so
# boto3 raises MissingDependencyException before Strands gets a look in.
aws-login = [
    "botocore[crt]",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
